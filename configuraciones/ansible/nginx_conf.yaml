---
- name: playbook
  hosts: "{{entorno}}"
  tasks:
    - name: Clonando repositorio git config-servidores
      git:
        repo: "https://github.com/alejandrofm98/config-servidores"
        dest: "/home/proyectos/config-servidores"
        version: develop
        force: yes
        update: yes

    - name: Crear red "shared_net" si no existe
      community.docker.docker_network:
        name: nginx-net
        driver: bridge
        attachable: true

    - name: Copy ssl certificates
      ansible.builtin.copy:
        src: ~/IdeaProjects/config-servidores/configuraciones/nginx/ssl_certs/
        dest: "/home/proyectos/config-servidores/configuraciones/nginx/ssl_certs/"
        force: true
      become: true

    - name: Run `docker-compose down`
      community.docker.docker_compose_v2:
        project_src: /home/proyectos/config-servidores/configuraciones/nginx/
        state: absent
        remove_volumes: true
      register: output


    - name: Run `docker-compose up`
      community.docker.docker_compose_v2:
        project_src: /home/proyectos/config-servidores/configuraciones/nginx/
        build: always
      register: output