version: "3.5"
services:
  db:
    image: mysql
    restart: always
    ports:
      - "${MYSQL_PORT}:3306"
    expose:
      - 3306:3306
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_USER: ${MYSQL_USER:-user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password}
    volumes:
      - ./init:/docker-entrypoint-initdb.d
    networks:
      - shared-network
networks:
  shared-network:
    external: true